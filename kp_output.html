<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KP Astrology — Analysis Dashboard</title>
<link rel="stylesheet" href="kp_styles.css">
<style>
/* ── Dashboard layout ── */
.dashboard-header {
  padding: 28px 0 24px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 32px;
}
.native-bar {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 24px;
}
.native-name {
  font-family: 'Cinzel', serif;
  font-size: 28px;
  color: var(--gold-light);
  letter-spacing: 1px;
}
.native-meta {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 5px;
  letter-spacing: 0.5px;
}
.dba-pill {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}
.dba-pill-item {
  background: var(--bg-section);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 8px 18px;
  text-align: center;
  min-width: 100px;
}
.dba-pill-label {
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  display: block;
  margin-bottom: 4px;
}
.dba-pill-value {
  font-family: 'Cinzel', serif;
  font-size: 16px;
  color: var(--gold-light);
  display: block;
}
.dba-sep { color: var(--text-hint); font-size: 20px; }
.dba-dates {
  text-align: right;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.04em;
  margin-top: 6px;
}




/* Houses list — one per row */
.houses-list {
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin-bottom: 60px;
}

/* House row card */
.house-row {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 3px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeUp 0.4s ease forwards;
  cursor: pointer;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.house-row:hover {
  border-color: var(--gold-dim);
  box-shadow: var(--shadow-md);
}
.house-row:nth-child(1)  { animation-delay: 0.04s }
.house-row:nth-child(2)  { animation-delay: 0.08s }
.house-row:nth-child(3)  { animation-delay: 0.12s }
.house-row:nth-child(4)  { animation-delay: 0.16s }
.house-row:nth-child(5)  { animation-delay: 0.20s }
.house-row:nth-child(6)  { animation-delay: 0.24s }
.house-row:nth-child(7)  { animation-delay: 0.28s }
.house-row:nth-child(8)  { animation-delay: 0.32s }
.house-row:nth-child(9)  { animation-delay: 0.36s }
.house-row:nth-child(10) { animation-delay: 0.40s }
.house-row:nth-child(11) { animation-delay: 0.44s }
.house-row:nth-child(12) { animation-delay: 0.48s }

/* Nature left border */
.house-row.nature-supportive  { border-left: 4px solid var(--nature-support); }
.house-row.nature-obstructive { border-left: 4px solid var(--nature-obstruct); }
.house-row.nature-mixed       { border-left: 4px solid var(--nature-mixed); }
.house-row.nature-neutral     { border-left: 4px solid var(--border); }

/* Row header */
.row-header {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 16px 20px;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
}
.row-house-num {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 2px;
  min-width: 60px;
}
.row-house-name {
  font-family: 'Cinzel', serif;
  font-size: 16px;
  color: var(--gold-light);
  letter-spacing: 1px;
  flex: 1;
}
.row-house-domain {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.3px;
}
.row-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-left: auto;
}
.row-sl {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
}
.row-sl strong {
  font-family: 'Cinzel', serif;
  color: var(--gold-dim);
}
.row-arrow {
  color: var(--text-hint);
  font-size: 14px;
  transition: transform 0.2s, color 0.2s;
}
.house-row:hover .row-arrow {
  color: var(--gold-dim);
  transform: translateX(4px);
}

/* Row body — interpretation */
.row-body {
  padding: 22px 24px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 24px;
  align-items: start;
}
.row-interp {
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  font-weight: 400;
  line-height: 1.85;
  color: var(--text-secondary);
  font-style: normal;
  letter-spacing: 0.01em;
}
.row-interp strong {
  color: var(--text-primary);
  font-style: normal;
  font-weight: 600;
}
.row-side {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-end;
  min-width: 140px;
}
.row-verdict {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  text-align: right;
  padding: 6px 12px;
  border-radius: 2px;
  letter-spacing: 1px;
}
.verdict-active {
  background: rgba(80,168,112,0.12);
  color: var(--nature-support);
  border: 1px solid rgba(80,168,112,0.25);
}
.verdict-possible {
  background: rgba(212,160,64,0.12);
  color: var(--nature-mixed);
  border: 1px solid rgba(212,160,64,0.25);
}
.verdict-denied {
  background: rgba(192,80,64,0.12);
  color: var(--nature-obstruct);
  border: 1px solid rgba(192,80,64,0.25);
}
.verdict-promised {
  background: rgba(80,128,192,0.12);
  color: var(--accent-blue);
  border: 1px solid rgba(80,128,192,0.25);
}

/* Score mini bar */
.score-mini {
  text-align: right;
}
.score-mini-label {
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.score-mini-val {
  font-family: 'Cinzel', serif;
  font-size: 20px;
}
.score-pos { color: var(--nature-support); }
.score-neg { color: var(--nature-obstruct); }
.score-zero { color: var(--text-muted); }

/* Row footer */
.row-footer {
  padding: 10px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,0.1);
}
.row-footer-left {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  gap: 16px;
}
.row-footer-left span strong {
  font-family: 'Cinzel', serif;
  color: var(--text-secondary);
  font-size: 11px;
}
.row-detail-link {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--gold-dim);
  cursor: pointer;
  transition: color 0.2s;
}
.row-detail-link:hover { color: var(--gold); }

/* Loading / no-data */
.loading-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  gap: 20px;
}
.loading-symbol {
  font-family: 'Cinzel', serif;
  font-size: 48px;
  color: var(--gold-dim);
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50%       { opacity: 1; }
}
.loading-text {
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text-muted);
}
.no-data {
  text-align: center;
  padding: 60px 20px;
}
.no-data h2 {
  font-family: 'Cinzel', serif;
  font-size: 18px;
  color: var(--gold-dim);
  margin-bottom: 12px;
}
.no-data p { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }

@media (max-width: 768px) {
  .row-body { grid-template-columns: 1fr; }
  .row-side { align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
  .native-bar { flex-direction: column; }
  .row-meta { margin-left: 0; margin-top: 8px; }
}
</style>
</head>
<body>

<nav class="global-nav">
  <div class="nav-brand" onclick="window.location.href='index.html'">
    KP Astrology Analyser
    <span>Krishnamurti Paddhati</span>
  </div>
  <div class="nav-actions">
    <span class="nav-native" id="nav-native-name"></span>
    <button class="btn-ghost" onclick="window.location.href='index.html'">← New Chart</button>
  </div>
</nav>

<div class="wrapper" style="max-width:1000px;">

  <div class="loading-screen" id="loading-screen">
    <div class="loading-symbol">✦</div>
    <div class="loading-text">Computing planetary influences…</div>
  </div>

  <div class="no-data" id="no-data-screen" style="display:none;">
    <h2>No Chart Data Found</h2>
    <p>Please complete the input form first to generate the analysis.</p>
    <button class="btn-primary" onclick="window.location.href='index.html'">Go to Input Form</button>
  </div>

  <div id="dashboard-content" style="display:none;">

    <div class="dashboard-header">
      <div class="native-bar">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;width:100%;margin-bottom:10px">
          <div>
            <div class="native-name" id="native-name-display">—</div>
            <div class="native-meta" id="native-meta-display">—</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:9px;color:var(--text-muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px">Created &amp; Analysis by</div>
            <div style="font-family:'Cinzel',serif;font-size:14px;color:var(--gold);letter-spacing:0.5px">Aman Motiyar</div>
          </div>
        </div>
        <div class="dba-pill">
          <div class="dba-pill-item">
            <span class="dba-pill-label">Mahadasha</span>
            <span class="dba-pill-value" id="dba-md-display">—</span>
          </div>
          <span class="dba-sep">›</span>
          <div class="dba-pill-item">
            <span class="dba-pill-label">Antardasha</span>
            <span class="dba-pill-value" id="dba-ad-display">—</span>
          </div>
          <span class="dba-sep">›</span>
          <div class="dba-pill-item">
            <span class="dba-pill-label">Pratyantara</span>
            <span class="dba-pill-value" id="dba-pd-display">—</span>
          </div>
        </div>
        <div class="dba-dates" id="dba-dates-display"></div>
      </div>
    </div>

    <div class="houses-list" id="houses-list"></div>

  </div>

</div>

<script src="kp_engine.js?v=2"></script>
<script>

function goToDetail(h) {
  sessionStorage.setItem('kp_active_house', h);
  window.location.href = 'kp_detail.html';
}

function getNatureClass(nature) {
  const map = {
    'Supportive':'supportive','Obstructive':'obstructive',
    'Mixed':'mixed','Neutral':'neutral'
  };
  return map[nature] || 'neutral';
}

function getVerdictClass(verdict) {
  if (verdict === 'Active' || verdict === 'Active with challenges') return 'verdict-active';
  if (verdict === 'Promised — awaiting period') return 'verdict-promised';
  if (verdict === 'Not Promised') return 'verdict-denied';
  return 'verdict-possible';
}

function renderDashboard(chartData, results) {
  document.getElementById('nav-native-name').textContent = chartData.native.name || '';
  document.getElementById('native-name-display').textContent = chartData.native.name || 'Native';
  document.getElementById('native-meta-display').textContent =
    [chartData.native.dob, `${chartData.native.tob_h}:${chartData.native.tob_m}`, chartData.native.place]
    .filter(Boolean).join('  ·  ');
  document.getElementById('dba-md-display').textContent = chartData.dba.md || '—';
  document.getElementById('dba-ad-display').textContent = chartData.dba.ad || '—';
  document.getElementById('dba-pd-display').textContent = chartData.dba.pd || '—';

  // Show period dates if entered
  const dbaFrom = chartData.dba.from;
  const dbaTo   = chartData.dba.to;
  const dbaDateEl = document.getElementById('dba-dates-display');
  if (dbaDateEl) {
    if (dbaFrom || dbaTo) {
      dbaDateEl.textContent = `Period: ${dbaFrom || '—'}  to  ${dbaTo || '—'}`;
    } else {
      dbaDateEl.textContent = '';
    }
  }



  const list = document.getElementById('houses-list');
  list.innerHTML = '';

  for (let h = 1; h <= 12; h++) {
    const r = results[h];
    if (!r) continue;

    const nature      = r.houseNature || 'Neutral';
    const natClass    = getNatureClass(nature);
    const verdictCls  = getVerdictClass(r.houseVerdict);
    const scoreClass  = r.houseNetScore > 0 ? 'score-pos' : r.houseNetScore < 0 ? 'score-neg' : 'score-zero';
    const interpText  = r.error ? 'Sub-lord data not entered for this house.' : generateHouseInterpretation(r, chartData);

    const row = document.createElement('div');
    row.className = `house-row nature-${natClass}`;
    row.onclick = () => goToDetail(h);

    row.innerHTML = `
      <div class="row-header">
        <div class="row-house-num">House ${h}</div>
        <div>
          <div class="row-house-name">${r.name}</div>
          <div class="row-house-domain">${r.domain}</div>
        </div>
        <div class="row-meta">
          <span class="row-sl">SL <strong>${r.slPlanet || '—'}</strong></span>
          <span class="row-sl" title="Nakshatra lord of where ${r.slPlanet} sits (NL of SL)">NL of SL <strong>${r.nlPlanet || '—'}</strong></span>
          <span class="row-sl">Sign <strong>${r.cuspSign || '—'}</strong></span>
          <span class="badge badge-${natClass}">${nature}</span>
          <span class="row-arrow">→</span>
        </div>
      </div>
      <div class="row-body">
        <div class="row-interp">${interpText}</div>
        <div class="row-side">
          <div class="row-verdict ${verdictCls}">${r.houseVerdict}</div>
          <div class="score-mini">
            <div class="score-mini-label">Net Score</div>
            <div class="score-mini-val ${scoreClass}">${r.houseNetScore > 0 ? '+' : ''}${r.houseNetScore}</div>
          </div>
        </div>
      </div>
      <div class="row-footer">
        <div class="row-footer-left">
          <span>Support <strong>${r.totalSupport}</strong></span>
          <span>Obstruct <strong>${r.totalObstruct}</strong></span>
          <span>Sub-events <strong>${r.subEvents.length}</strong></span>
        </div>
        <span class="row-detail-link">View Detail →</span>
      </div>`;

    list.appendChild(row);
  }
}

function init() {
  const chartData = loadChartData();
  document.getElementById('loading-screen').style.display = 'none';
  if (!chartData) {
    document.getElementById('no-data-screen').style.display = 'block';
    return;
  }
  const results = runFullChart(chartData);
  saveResults(results);
  document.getElementById('dashboard-content').style.display = 'block';
  renderDashboard(chartData, results);
}

setTimeout(init, 500);
</script>
</body>
</html>
