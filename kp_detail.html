<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KP Astrology — House Detail</title>
<link rel="stylesheet" href="kp_styles.css">
<style>
/* ── Detail layout ── */
.detail-layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 0;
  min-height: calc(100vh - 52px);
}

/* ── House sidebar ── */
.house-sidebar {
  background: var(--bg-header);
  border-right: 1px solid var(--border);
  padding: 20px 0;
  position: sticky;
  top: 52px;
  height: calc(100vh - 52px);
  overflow-y: auto;
}
.sidebar-title {
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 0 16px 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
.sidebar-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 16px;
  cursor: pointer;
  transition: background 0.15s;
  border-left: 3px solid transparent;
}
.sidebar-item:hover { background: var(--bg-section); }
.sidebar-item.active {
  background: var(--bg-section);
  border-left-color: var(--gold);
}
.sidebar-house-num {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  color: var(--text-muted);
  min-width: 24px;
}
.sidebar-house-name {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  color: var(--text-primary);
  letter-spacing: 0.5px;
}
.sidebar-item.active .sidebar-house-name { color: var(--gold-light); }
.sidebar-nature-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  margin-left: auto;
  flex-shrink: 0;
}
.dot-supportive  { background: var(--nature-support); }
.dot-obstructive { background: var(--nature-obstruct); }
.dot-mixed       { background: var(--nature-mixed); }
.dot-neutral     { background: var(--text-hint); }

/* ── Main content ── */
.detail-main {
  padding: 32px 36px 80px;
  min-width: 0;
}

/* House header */
.house-detail-header {
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--border);
}
.house-detail-title {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
}
.house-detail-name {
  font-family: 'Cinzel', serif;
  font-size: 26px;
  color: var(--gold-light);
  letter-spacing: 1px;
}
.house-detail-num {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  color: var(--text-muted);
  letter-spacing: 2px;
  margin-bottom: 4px;
}
.house-detail-sanskrit {
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-style: italic;
  color: var(--text-muted);
  margin-top: 4px;
}
.house-detail-domain {
  font-size: 11px;
  color: var(--text-secondary);
  letter-spacing: 0.5px;
  margin-top: 6px;
}

/* Cusp data strip */
.cusp-strip {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.cusp-item {
  background: var(--bg-section);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 6px 12px;
  text-align: center;
  min-width: 80px;
}
.cusp-item-label {
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  display: block;
  margin-bottom: 3px;
}
.cusp-item-value {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  color: var(--gold-dim);
  display: block;
}

/* Overall interpretation */
.house-overall-interp {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-left: 4px solid var(--gold-dim);
  padding: 20px 22px;
  border-radius: 0 3px 3px 0;
  margin-bottom: 32px;
}
.house-overall-interp .interp-text {
  font-size: 15px;
  line-height: 1.85;
}

/* Verdict row */
.verdict-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 14px;
}

/* Sub-events section */
.sub-events-label {
  font-size: 9px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--gold-dim);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.sub-events-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Sub-event card */
.sub-event-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 3px;
  margin-bottom: 16px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.sub-event-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
}
.sub-event-name {
  font-family: 'Cinzel', serif;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-primary);
  letter-spacing: 1px;
  flex: 1;
}
.sub-event-type {
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-hint);
}
.sub-event-toggle {
  color: var(--text-muted);
  font-size: 12px;
  transition: transform 0.2s;
}
.sub-event-card.collapsed .sub-event-toggle { transform: rotate(-90deg); }
.sub-event-card.collapsed .sub-event-body   { display: none; }

.sub-event-body { padding: 18px 16px; }

/* Score grid */
.score-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.score-item {
  background: var(--bg-section);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 10px 12px;
  text-align: center;
}
.score-item-label {
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  display: block;
  margin-bottom: 6px;
}
.score-item-value {
  font-family: 'Cinzel', serif;
  font-size: 16px;
  display: block;
}
.score-positive { color: var(--nature-support); }
.score-negative { color: var(--nature-obstruct); }
.score-neutral  { color: var(--text-secondary); }

/* Attributes */
.attrs-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}
.attr-item {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 8px 12px;
}
.attr-label {
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  display: block;
  margin-bottom: 3px;
}
.attr-value {
  font-size: 12px;
  color: var(--text-primary);
}

/* Combination output */
.combo-output {
  background: var(--bg-section);
  border-left: 3px solid var(--gold-dim);
  padding: 10px 14px;
  border-radius: 0 2px 2px 0;
  margin-top: 12px;
}
.combo-label {
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 5px;
}
.combo-text {
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-style: italic;
  color: var(--text-secondary);
  line-height: 1.6;
}

/* Sub-event plain-English summary */
.se-summary {
  margin-top: 14px;
  padding: 14px 16px;
  background: var(--bg-section);
  border-left: 3px solid var(--gold-dim);
  border-radius: 0 3px 3px 0;
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  font-weight: 400;
  line-height: 1.85;
  letter-spacing: 0.01em;
  color: var(--text-secondary);
}
.se-summary strong {
  color: var(--text-primary);
  font-weight: 600;
}

/* DBA detail strip */
.dba-detail-strip {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.dba-detail-item {
  font-size: 10px;
  padding: 3px 10px;
  border: 1px solid var(--border);
  border-radius: 2px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
}
.dba-detail-item.active-dba {
  border-color: var(--gold-dim);
  color: var(--gold-dim);
}

/* RP section */
.rp-detail {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.rp-tag {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  padding: 3px 10px;
  background: rgba(212,160,64,0.1);
  border: 1px solid rgba(212,160,64,0.2);
  border-radius: 2px;
  color: var(--gold-dim);
}

/* Promise indicator */
.promise-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 14px;
  padding: 8px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 2px;
}
.promise-icon { font-size: 14px; }
.promise-icon.yes     { color: var(--nature-support); }
.promise-icon.weak    { color: var(--nature-mixed); }
.promise-icon.denied  { color: var(--nature-obstruct); }

/* Loading / no-data */
.detail-loading {
  text-align: center;
  padding: 60px 0;
  color: var(--text-muted);
  font-size: 11px;
  letter-spacing: 2px;
}

@media (max-width: 768px) {
  .detail-layout { grid-template-columns: 1fr; }
  .house-sidebar { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
  .detail-main   { padding: 20px 16px 60px; }
  .score-grid    { grid-template-columns: repeat(2, 1fr); }
  .attrs-grid    { grid-template-columns: 1fr; }
}
</style>
</head>

<script>
// Override generateHouseSummary with latest version
// ═══════════════════════════════════════════════════
// HOUSE SUMMARY — Client-facing second-person narrative
// Combines promise strength + NL channel meanings
// ═══════════════════════════════════════════════════
// ═══════════════════════════════════════════════════
// HOUSE SUMMARY — 144 client-facing combination stories
// Input: NL's signified houses as channels for the topic
// Output: plain second-person narrative, no house numbers shown
// ═══════════════════════════════════════════════════
function generateHouseSummary(house, name, slPlanet, nlPlanet, slSig,
                               occupants, lagnesh, houseNature, houseVerdict,
                               ownStar, chartData, cuspSign) {
  const hData    = HOUSE_DATA[house] || {};
  const cluster  = hData.cluster  || [];
  const obstruct = hData.obstruct || [];
  const nlSig    = chartData.planetSig ? (chartData.planetSig[nlPlanet] || []) : [];

  const mainPresent  = slSig.includes(house);
  const supportHits  = cluster.filter(function(h) { return slSig.includes(h); });
  const obstructHits = obstruct.filter(function(h) { return slSig.includes(h); });

  const isStrong   = mainPresent && obstructHits.length === 0;
  const isMixed    = mainPresent && obstructHits.length > 0;
  const isIndirect = !mainPresent && supportHits.length >= 2;
  const isWeak     = !mainPresent && supportHits.length === 1;

  // Combination flags from NL signified houses
  var n = nlSig;
  var has = function(x) { return n.indexOf(x) !== -1; };

  // Key combination detectors
  var hasRecovery   = has(11);
  var hasObstacle   = has(6);
  var hasHospital   = has(12);
  var hasSurgery    = has(8);
  var hasForeign    = has(12);
  var hasCareer     = has(10);
  var hasFamily     = has(2);
  var hasGains      = has(11);
  var hasLuck       = has(9);
  var hasRomance    = has(5);
  var hasProperty   = has(4);

  // COMBINATION STORIES — 12 houses x 12 channels = 144 entries
  var STORIES = {

    // ── HOUSE 1: Personality, Body, Vitality ──────────────────────────────
    1: {
      1: isStrong
        ? 'You have a strong, clear sense of who you are. Your personality is well-defined and you carry yourself with presence. Vitality and health are personally important — and when life is supportive, your body reflects your inner strength.'
        : 'Your sense of self and identity are central themes in your life. The personality develops continuously through direct personal experience. Health and physical energy are recurring areas of attention throughout life.',

      2: 'Your identity is shaped significantly by your family background, values and the environment you grew up in. How you speak, what you own and what your family stands for all become extensions of who you are. There is a strong connection between your personality and your roots — your upbringing is visible in how you carry yourself.',

      3: 'Courage, communication and initiative define your personality. You are not a passive person — you act, you speak, you move forward. Mental boldness and the willingness to take the first step are core qualities of your character. Siblings and the immediate environment have also played a role in shaping who you are.',

      4: 'Emotional security and a sense of belonging are the foundations of your personality. You are deeply shaped by your home environment, your mother and your roots. Stability matters to you — your identity is anchored in where you come from and the emotional safety that your early life either gave or denied you.',

      5: 'Intelligence, creativity and a natural brightness define your personality. You are quick-thinking, expressive and drawn to learning and creative work. There is a quality of past life merit about you — certain gifts appear almost effortlessly, as if carried from before. Creative self-expression is not just a hobby, it is a core part of your identity.',

      6: (has(11)
        ? 'Your character is forged through challenges, competition and hard work. Adversity has made you stronger — you do not shy away from difficult situations, you use them as fuel. Health challenges may arise in life but you have the resilience to recover and come back stronger. Success in competition and self-driven effort is clearly indicated — the struggle is real but so is the victory.'
        : 'Your personality is shaped through service, struggle and overcoming obstacles. Challenges — health, competition or adversity — are recurring themes. The character you develop is tough and capable because it has been tested. Health matters require ongoing attention throughout life.'),

      7: 'You define yourself significantly through your relationships and public interactions. Partnerships, marriage and how others respond to you are deeply formative. You are strongly aware of how you are perceived and your identity evolves through your closest bonds. At your best, you bring a quality of harmony and awareness to everything you do.',

      8: 'Transformation, depth and reinvention are core to who you are. You go through significant personal changes in life — phases that most people never experience. Your personality has layers that others find hard to fully read. Sudden upheavals reshape your identity. Life does not stay still for you, and each transformation leaves you more complex and more resilient.',

      9: 'Wisdom, fortune and a naturally philosophical outlook colour your personality. You carry a quality of grace — things tend to work out for you in the bigger picture. Your father, a guru or a formative teacher may have played a defining role in who you became. Long journeys and higher learning have left their mark on your character.',

      10: 'Career, authority and public reputation are deeply tied to your sense of self. What you do professionally is a large part of who you are. You are naturally drawn to positions of responsibility and tend to be more comfortable when in a position of command or leadership.',

      11: (has(6)
        ? 'You are driven by ambition, social recognition and the desire to achieve. Success in competition and self-driven effort is a recurring theme. Challenges may arise — but they tend to resolve in your favour. Friends and networks are important to your identity, and you often define yourself by what you have built and achieved.'
        : 'Ambitions, gains and the desire to fulfil personal goals drive your personality. You are motivated by results and achievements. Social recognition matters. Friends, networks and elder siblings are important to your sense of who you are. You define yourself by what you accomplish.'),

      12: 'Solitude, spirituality, foreign environments and behind-the-scenes work shape your personality in deep ways. You have a rich inner world that others rarely see fully. Retreat, introspection and periods of isolation are recurring themes — and often the most formative ones. Foreign lands or spiritual pursuit may have been defining experiences.'
    },

    // ── HOUSE 2: Wealth, Family, Speech, Savings ──────────────────────────
    2: {
      1: 'Wealth comes entirely through your own personal effort and initiative. You are self-made — income depends directly on your energy and drive. No windfall or inherited wealth defines your financial story. What you earn, you earn through your own hands and mind.',

      2: 'Wealth and family matters are directly and strongly activated. Money accumulates steadily, family life is stable and speech is a genuine asset. Financial desires are fulfilled — this is one of the clearest confirmations of financial promise in a chart. Family additions and gains come together.',

      3: 'Communication skills, business negotiations, writing, media and short ventures are your primary income channels. You earn through your words, skills and mental sharpness. Siblings or local business networks may play a financially significant role. Your ability to articulate, negotiate and connect is your financial engine.',

      4: 'Family assets, ancestral property and home-related income are wealth channels. Real estate contributes to financial growth. The mother or family tradition plays a role in how wealth is accumulated. A stable domestic environment and property ownership form the financial foundation of your life.',

      5: 'Speculation, investments, creative work and education are income channels. Past life merit supports financial growth. Family expansion and financial fulfilment come together — the arrival of children may coincide with an improvement in finances. Intelligent risk-taking and creative ventures are productive.',

      6: (has(11)
        ? 'Service, employment, hard work and overcoming financial competition are your wealth channels. You earn through consistent effort and service rendered. Loans or debts may arise but they are manageable and can be repaid. Financial gain through employment, investment and service is confirmed — what you work for, you receive.'
        : 'Service and employment are the primary financial channels. Money comes through hard work and dedicated service. Debts or financial obligations may be a recurring theme. Competing for income is part of the story — but the effort is what produces results. Financial accumulation requires patience and discipline.'),

      7: 'Spouse or business partner plays a key role in your finances. Joint ventures, contracts and public dealings are productive income channels. Your financial life is significantly linked to your partnerships — the right collaboration can be transformative for your financial picture.',

      8: (has(11)
        ? 'Inheritance, unexpected gains, insurance and unearned income are financial channels. Wealth may arrive through sudden or unconventional means — a legacy, an insurance settlement or a transformation of assets. Financial desires are ultimately fulfilled even through unexpected paths.'
        : 'Hidden wealth, inheritance and sudden financial changes are the channels. Wealth may come through unconventional means but so may sudden losses. Financial life is not steady or predictable — it moves in significant shifts. Caution with speculative or high-risk financial decisions is advisable.'),

      9: 'Luck, fortune and past good karma support your financial growth. The father or a guiding figure may open financial doors at key moments. Long-distance dealings or foreign income channels contribute to wealth. Financial grace operates in your life — what others struggle for tends to come more naturally to you.',

      10: 'Career and professional achievement are the primary wealth engine. Salary, business profit and professional status drive income growth. This is the most stable and conventional source of wealth — what you build professionally, you earn financially. Professional recognition directly translates into financial advancement.',

      11: (has(6)
        ? 'Gains from your network, social connections and competitive efforts accumulate over time. Income is multi-sourced and builds steadily. Friends, elder siblings and community contacts are financially valuable. Financial desires are fulfilled — what you work and compete for, you receive.'
        : 'Gains, fulfilment of financial desires and accumulation through your social network are the channels. Income comes from multiple directions and builds steadily over time. Friends and connections are financially productive. What you wish for financially, you tend to achieve.'),

      12: (has(11)
        ? 'Foreign income, unconventional financial channels and spiritual investments are part of your wealth story. Money may come from abroad or through non-traditional means. Expenses are also significant — the financial flow is active in both directions. Ultimately, financial desires are met even through this unusual path.'
        : 'Foreign sources, hidden financial dealings and significant expenses define your financial picture. Wealth may arrive through foreign channels but outflow is equally present. Financial life requires careful management — the tendency to spend, donate or invest in invisible ways needs to be balanced against accumulation.')
    },

    // ── HOUSE 3: Courage, Communication, Siblings, Short Travel ──────────
    3: {
      1: 'Personal strength and physical confidence are the source of your courage. You are bold because you trust your own capabilities. Communication is direct, frank and driven by self-expression. You act before others have finished thinking.',

      2: 'Family support and financial backing give you confidence to take initiative. Your communication style is shaped by family values and upbringing. Speech is connected to financial interests — you negotiate and communicate for gain and family benefit.',

      3: 'Communication, courage and initiative are directly and fully activated. Writing, speaking, short travel and sibling relationships are all expressed without obstruction. This is the clearest indication of bold self-expression and the ability to act with confidence.',

      4: 'Emotional security and a stable home give you the foundation for courageous action. Communication is rooted in tradition and domestic values. Short travel may be home-related or property-oriented. The safety of your roots is what allows you to take bold steps.',

      5: 'Intelligence drives your communication and courageous acts. Creative writing, intellectually bold expression and education-related communication are highlighted. You think before you act, and your boldness is backed by genuine intelligence.',

      6: (has(11)
        ? 'Challenges and competition sharpen your courage and communication. You become bold through adversity — the more you are tested, the more direct and assertive you become. Written or verbal disputes, negotiations and legal matters may be handled with skill. You tend to win the battles you fight.'
        : 'Obstacles and competition challenge your communication and courage. Disputes, negotiations and difficult conversations are recurring themes. Courage is needed and eventually develops — but it comes through friction, not ease.'),

      7: 'Partnerships and public dealings enhance your communication and boldness. Your courage is expressed through negotiation, contracts and dealing with others. Siblings or short journeys may be connected to marriage or partnership matters.',

      8: 'Hidden information, research and deep investigation drive your communication. You are drawn to uncovering what is not immediately visible. Courage in the face of sudden events or transformations. Communication may involve secrets, sensitive matters or occult subjects.',

      9: 'Fortune and philosophical wisdom guide your communication and initiatives. Your boldness is backed by good judgment and a broad perspective. Publishing, teaching, long-distance learning and fortune-favoured negotiations are highlighted.',

      10: 'Professional standing and career demands drive your communication. You speak with authority and act decisively in professional contexts. Communication is a tool for career advancement. Your boldness is at its strongest in professional arenas.',

      11: (has(12)
        ? 'Social connections and networks amplify your communication reach, with some of this activity happening behind the scenes or through foreign channels. Gains come through communication efforts. Your boldness in reaching out, negotiating and connecting pays off — even when the work is not visible to others.'
        : 'Social connections and networks amplify your communication reach. Gains come through communication efforts. Elder siblings and friends may be involved. Your boldness is aimed at achieving desired outcomes and tends to produce results.'),

      12: 'Foreign or hidden communication becomes significant. Behind-the-scenes negotiations, correspondence with distant places or work done away from public view are your channels. Courage is expressed in isolation or in foreign environments — you may do your boldest work where others are not watching.'
    },

    // ── HOUSE 4: Home, Property, Mother, Education, Vehicles ──────────────
    4: {
      1: 'Personal effort and your own initiative are the channel for acquiring home and property. Domestic life and emotional security are deeply personal achievements — no one gives them to you. You build your home through your own hands and will.',

      2: 'Family wealth, ancestral assets and savings are the primary channel for property acquisition. Home is tied to family tradition and the resources built across generations. Mother and family provide both the financial and emotional foundation for property.',

      3: 'Skills, short ventures and siblings play a role in property matters. Property may be acquired through negotiation, short-term business or with a sibling involved. Communication around property decisions is active and significant.',

      4: 'Home, property and mother are directly and strongly activated. A stable domestic life, meaningful connection with the mother and property ownership are all clearly promised. This is the clearest confirmation of domestic fulfilment.',

      5: 'Speculative gains, investments and past life merit are channels for property acquisition. An intelligent or well-timed property decision may be the key. Creative or financially bold approaches to home ownership are favoured.',

      6: (has(11)
        ? 'Legal matters, mortgages and loans are connected to property — but they resolve in your favour. Property may come through overcoming a legal challenge or after a dispute is settled. Debts related to property are manageable. The struggle around home and property eventually produces the desired result.'
        : 'Legal disputes, mortgages, loans or complications are connected to property matters. The path to home ownership involves obstacles, paperwork or litigation. Property does not come easily — it requires effort and patience to resolve the complications around it.'),

      7: 'Spouse or business partner is involved in property acquisition. Joint ownership, shared home or the partner\'s assets contribute to domestic life. Legal property contracts are significant. The home you build is fundamentally a shared endeavour.',

      8: (has(11)

  if (!channelHouse) {
    for (var i = 0; i < cluster.length; i++) {
      if (has(cluster[i])) { channelHouse = cluster[i]; break; }
    }
  }

  // Priority 3: Pick the most relevant NL channel using per-house priority order
  if (!channelHouse) {
    for (var p = 0; p < priority.length; p++) {
      if (has(priority[p]) && obstruct.indexOf(priority[p]) === -1) {
        channelHouse = priority[p]; break;
      }
    }
  }

  // Priority 4: Obstruct house from priority order (still more relevant than distant non-obstruct)
  if (!channelHouse) {
    for (var p2 = 0; p2 < priority.length; p2++) {
      if (has(priority[p2])) { channelHouse = priority[p2]; break; }
    }
  }

  // Priority 5: Any signified house as last resort
  if (!channelHouse && nlSig.length > 0) channelHouse = nlSig[0];

  if (!channelHouse) return '';

  var story = houseStories[channelHouse];
  if (!story) return '';

  // Prefix with verdict context when story would contradict the verdict
  var notPromised = (houseVerdict === 'Not Promised');
  var isObstructive = (houseNature === 'Obstructive');

  // Houses where "not promised" prefix matters most (avoid contradicting)
  var contradictPhrases = [
    'directly and strongly activated',
    'clearly promised',
    'desires are fulfilled',
    'strongly promised',
    'clearly confirmed',
    'union will happen',
    'this is the clearest confirmation',
    'strongest possible position',
    'most direct fortune indicator',
    'directly activated',
    'central to the marriage',
    'supporting pillars of the marriage promise',
    'love will happen',
    'you achieve',
    'clearly indicated',
    'fully activated',
    'victory over enemies',
    'hospitalisation',
    'surgery and hospitalisation',
    'moksha'
  ];
  var wouldContradict = false;
  var storyLower = story.toLowerCase();
  contradictPhrases.forEach(function(p){ if(storyLower.indexOf(p.toLowerCase())>=0) wouldContradict=true; });

  if ((notPromised || isObstructive) && wouldContradict) {
    var notPromisedStories = {
      1: 'The personality and sense of self develop gradually and quietly in this chart. There is no dramatic statement of identity — instead, character builds through lived experience over time.',
      2: 'Consistent wealth accumulation is not the primary promise of this chart. Financial life tends to fluctuate rather than build steadily. Conscious effort and discipline around money are essential.',
      3: 'Communication and bold initiative are not the primary focus of this chart. Expression develops slowly and works best in specific, focused contexts rather than broadly.',
      4: 'A settled home and property ownership are not strongly indicated in this chart. Domestic life may be unconventional, delayed or subject to change. Roots may be found in unexpected places.',
      5: 'Children and creative fulfilment are not the primary promise here. These matters may come later than expected, through unconventional means, or may take forms different from what is imagined.',
      6: 'Health challenges and service are not dominant themes in this chart. The native tends to avoid major illness and conflict. When challenges do arise, they are manageable.',
      7: 'Marriage and conventional partnership are not strongly promised in this chart. Relationships may arrive in unconventional forms, later than expected, or with significant conditions attached.',
      8: 'Major transformation and sudden upheaval are not the defining pattern in this chart. Life tends to move more steadily. Deep change, when it comes, is gradual rather than dramatic.',
      9: 'Fortune and luck are not the primary promise here. Good outcomes in life come through sustained effort and right action rather than grace or windfall. The native creates their own fortune.',
      10: 'Career and conventional professional achievement are not the primary promise of this chart. Professional life may take an unconventional form or develop through a longer, less direct route.',
      11: 'Significant gains and easy desire fulfilment are not the strongest promise here. What the native wants, they must work deliberately towards. Income comes through effort, not fortune.',
      12: 'Foreign settlement and major spiritual renunciation are not the primary story in this chart. Life tends to stay anchored closer to home. Foreign and spiritual themes play a supporting role rather than a defining one.'
    };
    return notPromisedStories[house] || 'This area is not strongly promised in this chart. Results here depend on exceptional conditions and the right timing.';
  }

  return story;
}



function runHousePrediction(houseNum, chartData) {
  const houseInfo = HOUSE_DATA[houseNum];
  const cuspData  = chartData.cusps && chartData.cusps[houseNum];
  const planetSig = chartData.planetSig || {};
  const dba       = chartData.dba || {};
  const rp        = chartData.rp  || {};

  // Guard against missing data
  if (!cuspData || !cuspData.sl || cuspData.sl === '') {
    return {
      house: houseNum, name: houseInfo.name, domain: houseInfo.domain,
      error: 'Sub-lord not entered', subEvents: [],
      houseNature:'Neutral', houseVerdict:'Not Promised',
      totalSupport:0, totalObstruct:0, houseNetScore:0
    };
  }

  const slPlanet = cuspData.sl;
  const cuspSign = cuspData.sign;
  const signData = SIGN_DATA[cuspSign] || null;

  // Get true NL of SL (from planet position)
  const trueNL   = getNLofSL(slPlanet, chartData, cuspData.nl);
  const nlPlanet = trueNL || cuspData.nl;

  const slSig  = planetSig[slPlanet] || [];
  const nlSig  = planetSig[nlPlanet] || [];
  const mdSig  = planetSig[dba.md]   || [];
  const adSig  = planetSig[dba.ad]   || [];
  const pdSig  = planetSig[dba.pd]   || [];
  const dbaLords = [dba.md, dba.ad, dba.pd].filter(Boolean);

  // House-level promise (using corrected scoring)
  const mainPresent   = slSig.includes(houseNum);
  const clusterHits   = houseInfo.cluster.filter(h => slSig.includes(h));
  const obstructHits  = houseInfo.obstruct.filter(h => slSig.includes(h));
  const houseNetScore = (mainPresent ? 3 : 0) + clusterHits.length - obstructHits.length;
  const totalSupport  = mainPresent ? clusterHits.length + 1 : clusterHits.length;
  const totalObstruct = obstructHits.length;

  let houseNature = 'Mixed';
  if (houseNetScore >= 2) houseNature = 'Supportive';
  else if (houseNetScore <= -2) houseNature = 'Obstructive';

  // AD gate check for house verdict
  const adGateOpen = adSig.includes(houseNum) ||
                     houseInfo.cluster.some(h => adSig.includes(h));

  let houseVerdict = 'Not Promised';
  if (mainPresent || clusterHits.length >= 1) {
    if (adGateOpen && houseNetScore >= 0) houseVerdict = 'Active';
    else if (adGateOpen)                   houseVerdict = 'Active with challenges';
    else                                   houseVerdict = 'Promised — awaiting period';
  }

  // Occupying planets
  const occupants = getOccupyingPlanets(houseNum, chartData);

  // Sub-events
  const subEventResults = houseInfo.subEvents.map(seKey => {
    const fullKey = `H${houseNum}.${seKey}`;
    const rule    = SUB_EVENT_RULES[fullKey];
    if (!rule) return null;

    const promise    = checkPromise(fullKey, slSig);
    const dbaResult  = rule.type === 'Life'
      ? { score:0, verdict:'life_reading', adGate:'na' }
      : scoreDBA(fullKey, houseNum, mdSig, adSig, pdSig);
    const rpResult   = rule.type === 'Life'
      ? { rpScore:0, confidence:'na', matchedRPs:[] }
      : scoreRP(fullKey, rp, planetSig, dbaLords);
    const attrs      = deriveAttributes(fullKey, slSig, nlSig, slPlanet, nlPlanet,
                                         cuspSign, chartData, houseNum);
    const sign       = signData;
    const comboKey   = nlPlanet && sign ? `${nlPlanet}_${sign.element}` : null;
    const comboOut   = comboKey ? (COMBO_MAP[comboKey] || null) : null;

    return {
      key:         fullKey,
      name:        seKey.replace(/_/g,' '),
      type:        rule.type,
      promise,
      dba:         dbaResult,
      rp:          rpResult,
      attributes:  attrs,
      combination: comboOut,
      slPlanet, nlPlanet, cuspSign, signData,
      slSig, nlSig
    };
  }).filter(Boolean);

  return {
    house: houseNum, name: houseInfo.name, domain: houseInfo.domain,
    Sanskrit: houseInfo.Sanskrit,
    slPlanet, nlPlanet, cuspSign, signData,
    slSignif: slSig, nlSignif: nlSig,
    mainPresent, totalSupport, totalObstruct,
    houseNetScore, houseNature, houseVerdict,
    adActive: adGateOpen, occupants,
    subEvents: subEventResults
  };
}

// ═══════════════════════════════════════════════════
// FULL CHART RUNNER
// ═══════════════════════════════════════════════════

function runFullChart(chartData) {
  const results = {};
  for (let h = 1; h <= 12; h++) {
    results[h] = runHousePrediction(h, chartData);
  }
  return results;
}

function getChartSummary(results) {
  let supportive=0, mixed=0, obstructive=0, notPromised=0;
  Object.values(results).forEach(r => {
    if (r.error) { notPromised++; return; }
    if (r.houseVerdict === 'Not Promised') notPromised++;
    else if (r.houseNature === 'Supportive') supportive++;
    else if (r.houseNature === 'Obstructive') obstructive++;
    else mixed++;
  });
  return { supportive, mixed, obstructive, notPromised };
}

function getOrdinal(n) {
  const s=['th','st','nd','rd'], v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}

function getNatureTilt(score) {
  if (score >= 2) return 'Supportive';
  if (score <= -2) return 'Obstructive';
  return 'Mixed';
}


let activeHouse  = 1;
let chartData    = null;
let allResults   = null;

// ── Navigation ───────────────────────────────────
function buildSidebar() {
  const container = document.getElementById('sidebar-items');
  container.innerHTML = '';
  for (let h = 1; h <= 12; h++) {
    const r = allResults[h];
    const nature = r ? (r.houseNature || 'Neutral') : 'Neutral';
    const dotClass = `dot-${nature.toLowerCase()}`;
    const item = document.createElement('div');
    item.className = `sidebar-item${h === activeHouse ? ' active' : ''}`;
    item.id = `sidebar-h${h}`;
    item.onclick = () => loadHouseDetail(h);
    item.innerHTML = `
      <span class="sidebar-house-num">${h}</span>
      <span class="sidebar-house-name">${HOUSE_DATA[h].name}</span>
      <span class="sidebar-nature-dot ${dotClass}"></span>`;
    container.appendChild(item);
  }
}

function setActiveSidebar(h) {
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById(`sidebar-h${h}`);
  if (el) el.classList.add('active');
}

// ── Render house detail ──────────────────────────
function loadHouseDetail(houseNum) {
  activeHouse = houseNum;
  setActiveSidebar(houseNum);
  sessionStorage.setItem('kp_active_house', houseNum);

  const r = allResults[houseNum];
  const content = document.getElementById('detail-content');

  if (!r) {
    content.innerHTML = '<div class="detail-loading">No data for this house.</div>';
    return;
  }

  const interpText = r.error ? 'Sub-lord data not entered.' : generateHouseInterpretation(r, chartData);
  const nature     = r.houseNature || 'Neutral';
  const badgeClass = `badge-${nature.toLowerCase()}`;

  let html = `
    <div class="house-detail-header">
      <div class="house-detail-title">
        <div>
          <div class="house-detail-num">House ${houseNum} · ${r.Sanskrit}</div>
          <div class="house-detail-name">${r.name}</div>
          <div class="house-detail-domain">${r.domain}</div>
        </div>
        <span class="badge ${badgeClass}" style="margin-top:6px;">${nature}</span>
      </div>

      <div class="cusp-strip">
        <div class="cusp-item">
          <span class="cusp-item-label">Sign</span>
          <span class="cusp-item-value">${r.cuspSign || '—'}</span>
        </div>
        <div class="cusp-item">
          <span class="cusp-item-label">Sign Lord</span>
          <span class="cusp-item-value">${chartData.cusps[houseNum]?.rl || '—'}</span>
        </div>
        <div class="cusp-item">
          <span class="cusp-item-label">Star Lord</span>
          <span class="cusp-item-value">${r.nlPlanet || '—'}</span>
        </div>
        <div class="cusp-item">
          <span class="cusp-item-label">Sub Lord</span>
          <span class="cusp-item-value" style="color:var(--gold-light)">${r.slPlanet || '—'}</span>
        </div>
        <div class="cusp-item">
          <span class="cusp-item-label">Sub-Sub Lord</span>
          <span class="cusp-item-value">${chartData.cusps[houseNum]?.ss || '—'}</span>
        </div>
        ${r.signData ? `
        <div class="cusp-item">
          <span class="cusp-item-label">Element</span>
          <span class="cusp-item-value">${r.signData.element}</span>
        </div>
        <div class="cusp-item">
          <span class="cusp-item-label">Quality</span>
          <span class="cusp-item-value">${r.signData.quality}</span>
        </div>` : ''}
      </div>

      <div class="verdict-row">
        <span class="badge ${r.primaryPresent ? 'badge-active' : 'badge-neutral'}">
          ${r.primaryPresent ? '✓ Promised' : '✗ Not Promised'}
        </span>
        <span class="badge badge-${r.houseNature.toLowerCase()}">
          Net Score: ${r.houseNetScore > 0 ? '+' : ''}${r.houseNetScore}
        </span>
        <span class="badge ${r.adActive ? 'badge-active' : 'badge-neutral'}">
          AD ${r.adActive ? 'Active' : 'Inactive'}
        </span>
        <span class="badge badge-promised">
          ${r.houseVerdict}
        </span>
      </div>
    </div>

    <!-- Overall interpretation -->
    <div class="house-overall-interp">
      <div class="interp-text">${interpText}</div>
    </div>

    <!-- Sub-events -->
    <div class="sub-events-label">Sub-event Analysis</div>`;

  // Sub-events
  r.subEvents.forEach((se, idx) => {
    if (!se) return;
    const seNature = se.nature || 'Mixed';
    const seBadge  = `badge-${seNature.toLowerCase()}`;
    const promisedIcon = se.promise.promised
      ? (se.promise.strength === 'strong' ? '◉' : '◎')
      : '○';
    const promiseColor = se.promise.promised
      ? (se.promise.strength === 'strong' ? 'yes' : 'weak')
      : 'denied';

    const dbaVerdict = se.type === 'Life' ? 'Life Reading' : se.dba.verdict.replace(/_/g, ' ');
    const dbaActive  = se.dba.verdict === 'active';

    // Attributes
    let attrsHtml = '';
    if (Object.keys(se.attributes).length > 0) {
      attrsHtml = '<div class="attrs-grid">';
      Object.entries(se.attributes).forEach(([k, v]) => {
        const label = k.replace(/([A-Z])/g, ' $1').trim();
        attrsHtml += `
          <div class="attr-item">
            <span class="attr-label">${label}</span>
            <span class="attr-value">${v}</span>
          </div>`;
      });
      attrsHtml += '</div>';
    }

    // Combination output
    let comboHtml = '';
    if (se.combination) {
      comboHtml = `
        <div class="combo-output">
          <div class="combo-label">Planet + Sign Combination (${se.nlPlanet} × ${se.cuspSign})</div>
          <div class="combo-text">${se.combination}</div>
        </div>`;
    }

    // RP tags
    let rpHtml = '';
    if (se.rp.matchedRPs.length > 0) {
      rpHtml = `<div class="rp-detail">
        <span style="font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);">RP Match:</span>
        ${se.rp.matchedRPs.map(p => `<span class="rp-tag">${p}</span>`).join('')}
        <span class="badge badge-${se.rp.confidence === 'very_high' || se.rp.confidence === 'high' ? 'active' : 'neutral'}">${se.rp.confidence.replace(/_/g,' ')}</span>
      </div>`;
    }

    html += `
      <div class="sub-event-card" id="se-${idx}">
        <div class="sub-event-header" onclick="toggleSubEvent('se-${idx}')">
          <div class="promise-icon ${promiseColor}" style="font-size:16px;">${promisedIcon}</div>
          <div class="sub-event-name">${se.name}</div>
          <span class="badge ${seBadge}" style="margin-right:8px;">${seNature}</span>
          <span class="sub-event-type">${se.type}</span>
          <span class="sub-event-toggle">▾</span>
        </div>
        <div class="sub-event-body">

          <div class="promise-indicator">
            <span class="promise-icon ${promiseColor}">${promisedIcon}</span>
            <span>
              <strong style="color:var(--text-primary);">
                ${se.promise.promised ? `Promised — ${se.promise.strength} strength` : 'Not Promised — Primary house absent'}
              </strong>
              &nbsp;·&nbsp; Support: ${se.promise.supportCount} &nbsp;·&nbsp; Obstruct: ${se.promise.obstructCount} &nbsp;·&nbsp; Net: ${se.promise.netScore > 0 ? '+' : ''}${se.promise.netScore}
            </span>
          </div>

          ${se.type !== 'Life' ? `
          <div class="dba-detail-strip">
            <span class="dba-detail-item ${chartData.dba.md ? 'active-dba' : ''}">MD: ${chartData.dba.md}</span>
            <span style="color:var(--text-hint);padding:3px 2px;">›</span>
            <span class="dba-detail-item ${se.dba.adGate ? 'active-dba' : ''}">AD: ${chartData.dba.ad} ${se.dba.adGate ? '✓' : '✗'}</span>
            <span style="color:var(--text-hint);padding:3px 2px;">›</span>
            <span class="dba-detail-item">PD: ${chartData.dba.pd}</span>
            <span class="badge ${dbaActive ? 'badge-active' : se.dba.verdict === 'possible' ? 'badge-mixed' : 'badge-neutral'}" style="margin-left:8px;">
              ${dbaVerdict}
            </span>
          </div>` : `
          <div class="dba-detail-strip">
            <span class="dba-detail-item" style="color:var(--gold-dim);">Life Reading — Permanent chart indication, not DBA-dependent</span>
          </div>`}

          <div class="score-grid">
            <div class="score-item">
              <span class="score-item-label">Promise Score</span>
              <span class="score-item-value ${se.promise.netScore >= 0 ? 'score-positive' : 'score-negative'}">
                ${se.promise.netScore > 0 ? '+' : ''}${se.promise.netScore}
              </span>
            </div>
            <div class="score-item">
              <span class="score-item-label">DBA Score</span>
              <span class="score-item-value ${se.dba.score >= 0 ? 'score-positive' : 'score-negative'}">
                ${se.type === 'Life' ? '—' : (se.dba.score > 0 ? '+' : '') + se.dba.score}
              </span>
            </div>
            <div class="score-item">
              <span class="score-item-label">RP Score</span>
              <span class="score-item-value score-neutral">
                ${se.rp.rpScore}
              </span>
            </div>
          </div>

          ${rpHtml}
          ${attrsHtml}
          ${comboHtml}

          <div class="se-summary">
            ${generateSubEventSummary(se, houseNum, chartData)}
          </div>

        </div>
      </div>`;
  });

  content.innerHTML = html;
}

function toggleSubEvent(id) {
  document.getElementById(id).classList.toggle('collapsed');
}

// ── Init ─────────────────────────────────────────
function init() {
  chartData  = loadChartData();
  allResults = loadResults();

  if (!chartData || !allResults) {
    window.location.href = 'kp_output.html';
    return;
  }

  document.getElementById('nav-native-name').textContent = chartData.native.name || '';

  const savedHouse = parseInt(sessionStorage.getItem('kp_active_house')) || 1;
  activeHouse = savedHouse;

  buildSidebar();
  document.getElementById('detail-loading').style.display = 'none';
  document.getElementById('detail-content').style.display = 'block';
  loadHouseDetail(activeHouse);
}

init();
